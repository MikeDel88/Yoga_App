<div class="m3">
  <mat-card>
    <mat-card-title>
      <div fxLayout="row" fxLayoutAlign="start center">
        <button mat-icon-button data-testid="back-button" (click)="back()">
          <mat-icon>arrow_back</mat-icon>
        </button>
        <h1>User information</h1>
      </div>
    </mat-card-title>
    <mat-card-content>
      @if(user) {
        <div fxLayout="column" fxLayoutAlign="start center">
          <p data-testid="user-name">Name: {{ user.firstName }} {{ user.lastName | uppercase }}</p>
          <p data-testid="user-email">Email: {{ user.email }}</p>
          @if(user.admin) {
            <p class="my2" data-testid="admin-badge">You are admin</p>
          } @else {
            <div fxLayout="column" class="my2" fxLayoutAlign="center center">
              <p>Delete my account:</p>
              <button mat-raised-button color="warn" data-testid="delete-button" (click)="delete()">
                <mat-icon>delete</mat-icon>
                <span class="ml1">Delete</span>
              </button>
            </div>
          }
          <div fxLayoutAlign="space-between center" class="p2 w100">
            <p data-testid="created-at"><i>Create at: </i> {{ user.createdAt | date: 'longDate'}}</p>
            <p data-testid="updated-at"><i>Last update: </i> {{ user.updatedAt| date: 'longDate'}}</p>
          </div>
        </div>
      }
    </mat-card-content>
  </mat-card>
</div>
