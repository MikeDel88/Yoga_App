<div class="app">
  <mat-toolbar color="primary" fxLayout="row" fxLayoutAlign="space-between center">
    <span data-testid="app-title">Yoga app</span>
    @if($isLogged() | async) {
      <div>
        <span routerLink="sessions" class="link" data-testid="sessions-link">Sessions</span>
        <span routerLink="me" class="link" data-testid="account-link">Account</span>
        <span (click)="logout()" class="link" data-testid="logout-link">Logout</span>
      </div>
    } @else {
      <div>
        <a routerLink="/login" routerLinkActive="active" class="link" data-testid="login-link">Login</a>
        <a routerLink="/register" routerLinkActive="active" class="link" data-testid="register-link">Register</a>
      </div>
    }
  </mat-toolbar>
  <div>
    <router-outlet></router-outlet>
  </div>
</div>
