@let title = onUpdate ? 'Update session' : 'Create session';

<div class="create m3">
  <mat-card>
    <mat-card-title>
      <div fxLayout="row" fxLayoutAlign="start center">
        <button mat-icon-button data-testid="back-button" routerLink="/sessions">
          <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 data-testid="form-title">{{ title }}</h1>
      </div>
    </mat-card-title>
    @if(sessionForm) {
      <mat-card-content>
        <form class="mt2" fxLayout="column" [formGroup]="sessionForm" (ngSubmit)="submit()">
          <mat-form-field appearance="outline" fxFlex>
            <mat-label>Name</mat-label>
            <input matInput data-testid="name" formControlName="name">
          </mat-form-field>
          <mat-form-field appearance="outline" fxFlex>
            <mat-label>Date</mat-label>
            <input matInput type="date" data-testid="date" formControlName="date">
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Teacher</mat-label>
            <mat-select ngDefaultControl formControlName="teacher_id" data-testid="teacher-select">
              @for (teacher of teachers$ | async; track teacher.id) {
                <mat-option [value]="teacher.id">
                  {{teacher.firstName}} {{teacher.lastName}}
                </mat-option>
              }
            </mat-select>
          </mat-form-field>
          <mat-form-field appearance="outline" fxFlex>
            <mat-label>Description</mat-label>
            <textarea matInput rows="8" data-testid="description" formControlName="description"></textarea>
          </mat-form-field>
          <div fxLayout="row" fxLayoutAlign="center center">
            <button mat-raised-button color="primary" type="submit" data-testid="save-button" [disabled]="sessionForm.invalid">
              Save
            </button>
          </div>
        </form>
      </mat-card-content>
    }
  </mat-card>
</div>
